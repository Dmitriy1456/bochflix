server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1 "";
    server_tokens off;

    # Корень статики фронтенда (HTML, CSS, JS, IMAGES)
    root /Users/dmitriy/gemini-project-2/front-end;

    # MIME-типы: стандартные + дополнительные для фрагментов fMP4 и DASH
    include mime.types;
    types {
        video/iso.segment    m4s;
        application/dash+xml mpd;
    }

    # Снятие ограничений на размер передаваемых/загружаемых файлов и увеличение таймаутов
    client_max_body_size 0;
    client_body_buffer_size 16m;
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;

    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 300s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # Сжатие gzip (только для текстовых и веб-ресурсов, видео не сжимаем)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Главная страница: редирект на /HTML/index.html
    location = / {
        return 302 /HTML/index.html;
    }

    # Страница информации о фильме: редирект на /HTML/information.html
    location = /information.html {
        return 302 /HTML/information.html?$args;
    }

    # Страница ошибки отсутствия соединения с сервером
    location = /error.html {
        return 302 /HTML/error.html;
    }

    # Ошибки бэкенда при недоступности API
    error_page 502 503 504 /HTML/error.html;

    # 1. Бэкенд FastAPI (проксирование запросов к API)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Изображения фронтенда (маппинг /images/ на папку IMAGES/)
    location /images/ {
        alias /Users/dmitriy/gemini-project-2/front-end/IMAGES/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ==========================================================================
    # 3. Маршрут плеера: /movie/video/ -> /media/video/
    # Максимально эффективный стриминг монолитных faststart MP4 файлов
    # ==========================================================================
    location ^~ /movie/video/ {
        alias /Users/dmitriy/gemini-project-2/media/video/;

        # Модуль ngx_http_mp4_module для псевдостриминга (?start=N) и перемотки
        mp4;
        mp4_buffer_size 16m;
        mp4_max_buffer_size 512m;

        # Аппаратное zero-copy вещание ядра: sendfile + сетевые буферы
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        directio off;
        output_buffers 4 2m;

        # Полные CORS заголовки (Accept-Ranges bytes отдается Nginx автоматически)
        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;
        add_header Cache-Control "public, max-age=86400";

        error_page 500 = @fallback_movie_video;
    }

    location @fallback_movie_video {
        root /Users/dmitriy/gemini-project-2;
        rewrite ^/movie/video/(.*)$ /media/video/$1 break;

        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        directio off;
        output_buffers 4 2m;
        add_header Cache-Control "public, max-age=86400";
    }

    # ==========================================================================
    # 4. Выделенные каталоги тестового стенда (nginx-mp4-fmp4-stand.md)
    # ==========================================================================

    # 4.1. Монолитные MP4 (faststart)
    location ^~ /media/mp4/ {
        root /Users/dmitriy/gemini-project-2;
        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;

        mp4;
        mp4_buffer_size 16m;
        mp4_max_buffer_size 512m;

        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        directio off;
        output_buffers 4 2m;

        add_header Cache-Control "public, max-age=86400";
    }

    # 4.2. Фрагментированные fMP4 (чистая статика)
    location ^~ /media/fmp4/ {
        root /Users/dmitriy/gemini-project-2;
        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;

        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        directio off;
        output_buffers 4 2m;

        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ==========================================================================
    # 5. Медиа-каталоги проекта (video и trailers)
    # ==========================================================================

    # 5.1. /media/video/
    location ^~ /media/video/ {
        root /Users/dmitriy/gemini-project-2;
        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;

        mp4;
        mp4_buffer_size 16m;
        mp4_max_buffer_size 512m;

        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        directio off;
        output_buffers 4 2m;

        add_header Cache-Control "public, max-age=86400";
        error_page 500 = @fallback_media;
    }

    # 5.2. /media/trailers/
    location ^~ /media/trailers/ {
        root /Users/dmitriy/gemini-project-2;
        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;

        mp4;
        mp4_buffer_size 16m;
        mp4_max_buffer_size 512m;

        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        directio off;
        output_buffers 4 2m;

        add_header Cache-Control "public, max-age=86400";
        error_page 500 = @fallback_media;
    }

    location @fallback_media {
        root /Users/dmitriy/gemini-project-2;
        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;

        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        directio off;
        output_buffers 4 2m;
        add_header Cache-Control "public, max-age=86400";
    }

    # ==========================================================================
    # 6. Статические изображения медиа (постеры, баннеры, логотипы, иконки)
    # Чистая статика без mp4_module
    # ==========================================================================
    location ^~ /media/ {
        root /Users/dmitriy/gemini-project-2;
        include /Users/dmitriy/gemini-project-2/deploy/snippets/cors.conf;

        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;

        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 7. Фронтенд статика (HTML, JS, STYLES, FONTS)
    location / {
        try_files $uri $uri/ =404;
    }
}
