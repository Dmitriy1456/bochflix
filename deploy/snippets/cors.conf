# ==============================================================================
# Snippet CORS: полные заголовки для Range-запросов и стриминга (HTML5, ExoPlayer)
# ==============================================================================
add_header Access-Control-Allow-Origin   "*" always;
add_header Access-Control-Allow-Methods  "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers  "Range, If-Range, If-None-Match, If-Modified-Since, Origin, Accept, Content-Type" always;
add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges, ETag, Last-Modified" always;
add_header Access-Control-Max-Age        86400 always;

# Обработка preflight запросов
if ($request_method = OPTIONS) {
    return 204;
}
